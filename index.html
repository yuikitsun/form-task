<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Mesaj Formu</title>
</head>
<body>

    <form>
        <label for="message">Mesaj:</label><br>

        <textarea id="message" name="message" rows="5" cols="30"></textarea>

        <br><br>

        <label for="type">Mesaj növü:</label>

        <select id="type" name="type">
            <option value="sexsi">Şəxsi</option>
            <option value="ictimai">İctimai</option>
        </select>

        <br><br>

        <button type="submit">Mesaj Göndər</button>
    </form>

</body>
</html>
